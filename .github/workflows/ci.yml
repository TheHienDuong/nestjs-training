# CI — runs automatically on every push and every pull request.
#
# Purpose: prove that the code runs on A CLEAN MACHINE, not just on your local machine.
# "It works on my machine" is the phrase that has caused countless production incidents.
#
# This job is also the "required status check" for branch protection:
# If CI is red, the Merge button on GitHub is disabled.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Pushing a new commit to the same PR will cancel the previous run — saves CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Test · Build
    runs-on: ubuntu-latest

    # From Phase 2 (when Prisma is added), uncomment the block below to provision a dedicated PostgreSQL
    # instance for this CI run. It lives and dies with the job.
    #
    # services:
    #   postgres:
    #     image: postgres:16-alpine
    #     env:
    #       POSTGRES_USER: postgres
    #       POSTGRES_PASSWORD: postgres
    #       POSTGRES_DB: nestjs_training_test
    #     ports: ['5432:5432']
    #     options: >-
    #       --health-cmd pg_isready
    #       --health-interval 10s
    #       --health-timeout 5s
    #       --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # This action does NOT auto-detect the pnpm version. It reads the "packageManager" field# in package.json ("pnpm@11.18.0"). If this field is missing, the job will fail immediately. This ensures your local machine and CI use the exact same pnpm version — which is also the reason the `--frozen-lockfile` flag exists in the step below.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      # cache: 'pnpm' caches the pnpm store, so subsequent runs are much faster.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # --frozen-lockfile: installs dependencies exactly as specified in pnpm-lock.yaml, without automatically upgrading versions. If the lockfile is out of sync with package.json, the job will FAIL instead of silently installing different versions.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # --max-warnings=0: warnings are also treated as errors on CI.
      # (On your local machine `pnpm lint` has the --fix flag so it auto-fixes issues; on CI it only runs checks.)
      - name: Lint
        run: pnpm exec eslint "{src,apps,libs,test}/**/*.ts" --max-warnings=0

      - name: Check formatting (Prettier)
        run: pnpm exec prettier --check "src/**/*.ts" "test/**/*.ts" "docs/**/*.md" "*.md" "*.json" "*.yml" "*.mjs"

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      # E2E tests require a database, so they are enabled at the same time as services.postgres in Phase 2.
      # - name: E2E tests
      #   run: pnpm test:e2e
      #   env:#     DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nestjs_training_test