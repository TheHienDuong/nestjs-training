# CI — runs automatically on every push and every pull request.
#
# Purpose: prove the code runs on A CLEAN MACHINE, not just on your machine.
# "It still works on my machine" is the phrase that has caused countless production incidents.
#
# This job is also the "required status check" for branch protection:
# if CI is red, the Merge button on GitHub is disabled.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Pushing a new commit to the same PR cancels the previous run — saves CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Test · Build
    runs-on: ubuntu-latest

    # Starting from Phase 2 (once Prisma is added), uncomment the block below to provision a PostgreSQL
    # instance dedicated to this CI run. It lives and dies together with the job.
    #
    # services:
    #   postgres:
    #     image: postgres:16-alpine
    #     env:
    #       POSTGRES_USER: postgres
    #       POSTGRES_PASSWORD: postgres
    #       POSTGRES_DB: nestjs_training_test
    #     ports: ['5432:5432']
    #     options: >-
    #       --health-cmd pg_isready
    #       --health-interval 10s
    #       --health-timeout 5s
    #       --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # This action does NOT guess the pnpm version on its own. It reads the "packageManager" field
      # in package.json ("pnpm@11.18.0"). Missing that field makes the job fail immediately.
      # This ensures your machine and CI use the exact same pnpm version — the same reason
      # --frozen-lockfile exists in the step below.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      # cache: 'pnpm' caches the pnpm store -> the next run is much faster.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # --frozen-lockfile: installs exactly per pnpm-lock.yaml, without auto-upgrading versions.
      # If the lockfile is out of sync with package.json, the job FAILS instead of silently installing something else.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # --max-warnings=0: warnings are also treated as errors on CI.
      # (Locally `pnpm lint` has --fix so it self-corrects; on CI it only checks.)
      - name: Lint
        run: pnpm exec eslint "{src,apps,libs,test}/**/*.ts" --max-warnings=0

      - name: Check format (Prettier)
        run: pnpm exec prettier --check "src/**/*.ts" "test/**/*.ts" "docs/**/*.md" "*.md" "*.json" "*.yml" "*.mjs"

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      # E2E needs a database, so enable it together with services.postgres in Phase 2.
      # - name: E2E tests
      #   run: pnpm test:e2e
      #   env:
      #     DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nestjs_training_test
