# CI — runs automatically on every push and pull request.
#
# Purpose: prove that the code runs on A CLEAN MACHINE, not only on your machine.
# "It still works on my machine" is a phrase that has caused countless production incidents.
#
# This job is also the "required status check" for branch protection:
# when CI is red, the Merge button on GitHub is disabled.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Pushing a new commit to the same PR cancels the old run — saving CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Test · Build
    runs-on: ubuntu-latest

    # From Phase 2 (when Prisma is introduced), uncomment the block below to provide a PostgreSQL instance
    # dedicated to this CI run. It lives and dies with the job.
    #
    # services:
    #   postgres:
    #     image: postgres:16-alpine
    #     env:
    #       POSTGRES_USER: postgres
    #       POSTGRES_PASSWORD: postgres
    #       POSTGRES_DB: nestjs_training_test
    #     ports: ['5432:5432']
    #     options: >-
    #       --health-cmd pg_isready
    #       --health-interval 10s
    #       --health-timeout 5s
    #       --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # This action DOES NOT guess the pnpm version. It reads the "packageManager" field
      # in package.json ("pnpm@11.18.0"). Without that field, the job fails immediately.
      # This ensures your machine and CI use the exact same pnpm version — the same reason
      # --frozen-lockfile exists in the step below.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # cache: 'pnpm' caches the pnpm store -> subsequent runs are much faster.
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      # --frozen-lockfile: installs exactly from pnpm-lock.yaml without upgrading versions.
      # If the lockfile differs from package.json, the job FAILS instead of silently installing something else.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # --max-warnings=0: warnings are also treated as errors in CI.
      # (Locally, `pnpm lint` includes --fix and fixes them automatically; CI only checks.)
      - name: Lint
        run: pnpm exec eslint "{src,apps,libs,test}/**/*.ts" --max-warnings=0

      - name: Check formatting (Prettier)
        run: pnpm exec prettier --check "src/**/*.ts" "test/**/*.ts"

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      # E2E needs a database, so enable it together with services.postgres in Phase 2.
      # - name: E2E tests
      #   run: pnpm test:e2e
      #   env:
      #     DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nestjs_training_test
