# Codex review — runs automatically on EVERY PR (the code-quality "layer 1").
#
# This is the automated, FREE review layer, distinct from the "Copilot CLI gatekeeper"
# (dispatched interactively via herdr, only for mr/* branches, max 2 times/day — see
# docs/workflow/REVIEW-MODEL.md §5). The prompt is self-contained, reads AGENTS.md +
# CLAUDE.md, and returns a verdict at P0/P1/P2 severity. Do NOT modify this file except
# via Hermes/Claude (it's under `.github/**` — see docs/workflow/AGENT-MODEL.md file
# boundaries).

name: Codex Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

# A new push to the same PR cancels the previous review run — saves Codex quota.
concurrency:
  group: codex-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: Codex code-quality review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Codex review
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/codex/prompts/review.md
