# Dependabot — GitHub's bot that automatically monitors dependencies and opens PRs when new versions are available.
#
# Why even a learning project should enable it:
#   1. Outdated dependencies are the most common source of security vulnerabilities in Node.js.
#   2. You get to build a real habit: bump version -> read changelog -> wait for CI -> merge, instead of having to upgrade 40 packages all at once 2 years later.
#   3. Every Dependabot PR is a chance to see CI in action: if the new version breaks tests, CI will fail right on that PR and you'll immediately know why.

version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    # Limit to 5 open PRs at a time to avoid being overwhelmed.
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    # Group packages from the same family into a SINGLE PR. Upgrading @nestjs/* individually easily causes version mismatches between packages in the same suite, and Nest requires them to be upgraded together.
    groups:
      nestjs:
        patterns:
          - '@nestjs/*'
      typescript-eslint:
        patterns:
          - 'typescript-eslint'
          - '@typescript-eslint/*'
          - 'eslint*'
      testing:
        patterns:
          - 'jest'
          - 'ts-jest'
          - '@types/jest'
          - 'supertest'
          - '@types/supertest'
    labels:
      - dependencies

  # Keep the GitHub Actions in workflows up to date.
  - package-ecosystem: github-actions    directory: '/'
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
    labels:
      - dependencies
      - ci