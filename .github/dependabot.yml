# Dependabot — bot của GitHub tự theo dõi dependency và mở PR khi có bản mới.
#
# Vì sao một dự án học tập cũng nên bật:
#   1. Dependency lỗi thời là nguồn lỗ hổng bảo mật phổ biến nhất trong Node.js.
#   2. Bạn được tập một thói quen thật: nâng version -> đọc changelog -> chờ CI ->
#      merge, thay vì để 2 năm sau phải nâng 40 package cùng lúc.
#   3. Mỗi PR của Dependabot là một dịp thấy CI làm việc: nếu bản mới làm vỡ test,
#      CI đỏ ngay trên PR đó và bạn biết ngay là do đâu.

version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    # Giới hạn 5 PR mở cùng lúc để không bị ngập.
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    # Gom các package cùng họ vào MỘT PR. Nâng @nestjs/* lẻ tẻ dễ gây lệch
    # version giữa các package cùng bộ, và Nest yêu cầu chúng đi cùng nhau.
    groups:
      nestjs:
        patterns:
          - '@nestjs/*'
      typescript-eslint:
        patterns:
          - 'typescript-eslint'
          - '@typescript-eslint/*'
          - 'eslint*'
      testing:
        patterns:
          - 'jest'
          - 'ts-jest'
          - '@types/jest'
          - 'supertest'
          - '@types/supertest'
    labels:
      - dependencies

  # Giữ chính các GitHub Action trong workflow luôn mới.
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
    labels:
      - dependencies
      - ci
