image: node:22

stages:
  - verify

verify:
  stage: verify
  before_script:
    - corepack enable
  script:
    - pnpm install --frozen-lockfile
    - pnpm exec eslint "{src,apps,libs,test,scripts,prisma}/**/*.ts" --max-warnings=0
    - pnpm exec prettier --check "src/**/*.ts" "test/**/*.ts" "scripts/**/*.ts" "docs/**/*.md" "*.md" "*.json" "*.yml" "*.mjs"
    - pnpm test
    - pnpm build
